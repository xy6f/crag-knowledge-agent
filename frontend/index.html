<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic RAG 知识库问答</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🤖</span>
      <div>
        <h1>Agentic RAG 知识库问答</h1>
        <p class="subtitle">星野科技 · CRAG 纠错式检索 Agent</p>
      </div>
    </div>
    <div class="status-chips">
      <span id="chip-api" class="chip">检测中…</span>
      <span id="chip-kb" class="chip">知识库加载中…</span>
      <button id="btn-kb" class="btn-ghost">📚 知识库</button>
    </div>
  </header>

  <main class="chat-panel">
    <div id="chat-window" class="chat-window">
      <div class="welcome card">
        <h2>👋 你好，我是星野知识库助手</h2>
        <p>基于 <b>CRAG 纠错式 Agentic RAG</b>：回答以流式逐字输出；检索打分、查询改写、联网兜底、幻觉自检等<b>决策过程默认收起</b>，点击回答上方的「正在思考」条即可展开查看。</p>
        <div class="example-grid">
          <button class="example" data-q="员工年假有几天？">员工年假有几天？（陷阱题）</button>
          <button class="example" data-q="我入职三年了，年假有几天？想连休请年假需要提前多久申请，找谁审批？">年假天数 + 审批流程（多跳题）</button>
          <button class="example" data-q="采购云途专业版 60 个账号按年付，一年多少钱？">云途专业版报价（调价陷阱）</button>
          <button class="example" data-q="今天上海天气怎么样？">超纲题（看联网兜底）</button>
        </div>
      </div>
    </div>

    <button id="btn-bottom" class="btn-bottom" hidden title="回到底部">↓</button>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="question" rows="1" placeholder="输入问题，Enter 发送 / Shift+Enter 换行"></textarea>
        <button id="btn-send" class="btn-send" title="发送">↑</button>
      </div>
      <p class="input-hint">回答由 AI 生成，请以公司现行制度文件为准</p>
    </div>
  </main>

  <!-- 知识库抽屉 -->
  <div id="kb-drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h3>📚 知识库管理</h3>
      <button id="btn-drawer-close" class="btn-close">✕</button>
    </div>
    <div class="kb-actions">
      <label class="btn-ghost file-btn">
        <input type="file" id="file-input" accept=".md,.txt,.pdf" hidden />
        ⬆️ 上传文档
      </label>
      <button id="btn-rebuild" class="btn-ghost">♻️ 重建示例语料</button>
    </div>
    <div class="kb-stat"><span id="kb-total">—</span> 个向量分块</div>
    <ul id="doc-list" class="doc-list"></ul>
  </div>
  <div id="drawer-backdrop" class="backdrop" hidden></div>

  <script src="app.js?v=2"></script>
</body>
</html>
